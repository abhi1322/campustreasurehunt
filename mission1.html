<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Manrope:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a0e1a; --panel:#131c30; --panel-2:#1c2841; --panel-line:#2a3854;
  --gold:#e8b95c; --gold-bright:#f8d999; --mystic:#9b7fe8;
  --ink:#ede6d3; --ink-dim:#a29c88; --success:#63c584; --danger:#e2705a;
  --font-display:'Cinzel',serif; --font-body:'Manrope',sans-serif; --font-mono:'Space Mono',monospace;
  --accent: var(--gold);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--void);color:var(--ink);font-family:var(--font-body);min-height:100vh;overflow-x:hidden;position:relative;-webkit-tap-highlight-color:transparent;}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:.02em;}
button{font-family:var(--font-body);}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 20% -10%, rgba(232,185,92,.08), transparent 55%),radial-gradient(ellipse at 100% 110%, rgba(155,127,232,.10), transparent 55%);pointer-events:none;z-index:0;}
#lantern{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle 260px at var(--lx,50%) var(--ly,30%), rgba(232,185,92,.10), rgba(232,185,92,.03) 45%, transparent 70%);transition:background .15s linear;}
#app{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;}
.wrap{max-width:560px;width:100%;margin:0 auto;padding:20px 18px 48px;flex:1;display:flex;flex-direction:column;animation:fadeSlide .45s ease both;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.brand{font-family:var(--font-display);font-size:14px;letter-spacing:.12em;color:var(--gold-bright);text-transform:uppercase;opacity:.85;}
.count-pill{font-family:var(--font-mono);font-size:13px;background:var(--panel-2);border:1px solid var(--panel-line);color:var(--gold-bright);padding:5px 11px;border-radius:20px;}
.trail{display:flex;align-items:center;justify-content:space-between;margin:4px 0 22px;padding:12px 8px;background:linear-gradient(180deg,var(--panel),transparent);border-radius:16px;position:relative;}
.trail::before{content:"";position:absolute;left:10%;right:10%;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--panel-line) 0 6px,transparent 6px 12px);z-index:0;transform:translateY(-14px);}
.trail-node{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
.trail-dot{width:30px;height:30px;border-radius:50%;background:var(--panel-2);border:2px solid var(--panel-line);display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--font-mono);transition:all .3s ease;}
.trail-node.done .trail-dot{background:radial-gradient(circle,var(--gold-bright),var(--gold));border-color:var(--gold);box-shadow:0 0 14px rgba(232,185,92,.6);color:#241505;}
.trail-node.current .trail-dot{border-color:var(--gold);animation:pulseRing 1.6s ease-in-out infinite;}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(232,185,92,.5);}50%{box-shadow:0 0 0 6px rgba(232,185,92,.12);}}
.trail-label{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-dim);}
.trail-node.done .trail-label{color:var(--gold-bright);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;padding:16px 22px;border-radius:14px;border:none;cursor:pointer;min-height:54px;transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease;-webkit-user-select:none;user-select:none;width:100%;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--gold-bright),var(--gold));color:#241505;box-shadow:0 6px 20px rgba(232,185,92,.28);}
.btn-primary:disabled{opacity:.35;box-shadow:none;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--ink-dim);border:1px solid var(--panel-line);}
.btn-sm{padding:10px 14px;min-height:auto;font-size:13px;width:auto;}
.card{background:var(--panel);border:1px solid var(--panel-line);border-radius:20px;padding:22px 20px;margin-bottom:16px;}
.mission-badge{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.mission-icon{font-size:34px;width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--accent) 18%, var(--panel));border:1px solid color-mix(in srgb, var(--accent) 45%, var(--panel-line));flex-shrink:0;}
.mission-eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;}
.mission-title{font-size:24px;color:var(--ink);line-height:1.15;}
.mission-flavor{color:var(--ink-dim);font-size:14.5px;line-height:1.55;margin-top:10px;}
.clue-box{margin-top:16px;padding:18px 16px;border-radius:14px;background:linear-gradient(135deg, rgba(232,185,92,.12), rgba(232,185,92,.03));border:1px dashed var(--gold);font-family:var(--font-display);font-size:16px;color:var(--gold-bright);line-height:1.55;text-align:center;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--panel-line);padding:12px 20px;border-radius:30px;font-size:14px;opacity:0;transition:all .3s ease;z-index:50;pointer-events:none;max-width:90%;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.shake{animation:shakeAnim .4s ease;}
@keyframes shakeAnim{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.pop{animation:popAnim .4s ease;}
@keyframes popAnim{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
.hero{text-align:center;padding:30px 4px 10px;}
.hero-icon{font-size:52px;margin-bottom:10px;filter:drop-shadow(0 0 18px rgba(232,185,92,.5));}
.hero h1{font-size:28px;color:var(--gold-bright);line-height:1.25;}
.hero p{color:var(--ink-dim);font-size:15px;margin-top:10px;line-height:1.6;}
.room{position:relative;aspect-ratio:4/3;border-radius:16px;background:linear-gradient(180deg, rgba(232,185,92,.08), transparent 50%),repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, transparent 2px 40px),var(--panel-2);border:1px solid var(--panel-line);margin-top:16px;overflow:hidden;}
.room-item{position:absolute;width:58px;height:58px;transform:translate(-50%,-50%);border-radius:14px;background:var(--panel);border:1px solid var(--panel-line);display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer;transition:transform .15s ease,box-shadow .2s ease;}
.room-item:active{transform:translate(-50%,-50%) scale(.9);}
.room-item.found{background:radial-gradient(circle,var(--gold-bright),var(--gold));box-shadow:0 0 30px rgba(232,185,92,.8);}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;}
.mem-card{aspect-ratio:1/1.15;position:relative;cursor:pointer;perspective:600px;}
.mem-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s ease;border-radius:12px;}
.mem-card.flipped .mem-inner{transform:rotateY(180deg);}
.mem-face{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-size:24px;border:1px solid var(--panel-line);}
.mem-front{background:linear-gradient(145deg,var(--panel-2),var(--panel));color:var(--gold);font-size:19px;}
.mem-back{background:var(--panel);transform:rotateY(180deg);}
.mem-card.matched .mem-back{background:color-mix(in srgb, var(--success) 22%, var(--panel));border-color:var(--success);}
.maze{display:grid;gap:4px;margin-top:16px;aspect-ratio:1/1;}
.maze-cell.wall{background:var(--void);border-radius:6px;}
.maze-cell.path{background:var(--panel-2);border:1px solid var(--panel-line);border-radius:6px;}
.maze-cell.exit{background:radial-gradient(circle,var(--gold-bright),var(--gold));box-shadow:0 0 16px rgba(232,185,92,.7);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.maze-robot{display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,28px);transition:grid-row .18s ease, grid-column .18s ease;z-index:2;}
.dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;max-width:220px;margin:18px auto 0;}
.dpad button{font-size:20px;padding:14px 0;border-radius:12px;background:var(--panel-2);border:1px solid var(--panel-line);color:var(--ink);}
.dpad button:active{background:var(--panel);}
.jigsaw{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:16px;aspect-ratio:1/1;max-width:260px;margin-left:auto;margin-right:auto;border-radius:14px;overflow:hidden;border:2px solid var(--panel-line);}
.jig-tile{background-size:200% 200%;cursor:pointer;border:2px solid rgba(10,14,26,.5);transition:outline .15s ease, transform .15s ease;}
.jig-tile.selected{outline:3px solid var(--gold-bright);outline-offset:-3px;transform:scale(.94);}
.blocks-row{display:flex;gap:10px;margin-top:20px;justify-content:center;}
.block{width:64px;height:64px;border-radius:14px;background:linear-gradient(145deg,var(--panel-2),var(--panel));border:2px solid var(--panel-line);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:24px;font-weight:700;color:var(--gold-bright);cursor:pointer;transition:outline .15s ease, transform .15s ease;}
.block.selected{outline:3px solid var(--gold-bright);outline-offset:-3px;transform:scale(.92);}
.block.correct{border-color:var(--success);color:var(--success);}
.trophy-wrap{text-align:center;padding:30px 0 10px;}
.trophy-emoji{font-size:88px;display:inline-block;animation:trophyBounce 1.4s ease infinite;filter:drop-shadow(0 0 30px rgba(232,185,92,.6));}
@keyframes trophyBounce{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-14px) rotate(2deg);}}
.final-msg{font-size:24px;color:var(--gold-bright);margin-top:14px;}
.final-sub{color:var(--ink-dim);margin-top:10px;font-size:15px;line-height:1.6;}
.coordinator-box{margin-top:22px;padding:16px;border-radius:14px;background:var(--panel);border:2px solid var(--gold);font-size:15px;text-align:center;color:var(--ink);}
.route-list{display:flex;flex-direction:column;gap:10px;margin-top:4px;}
.route-item{display:flex;align-items:center;gap:12px;padding:14px 14px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;}
.route-item .n{font-family:var(--font-mono);color:var(--gold-bright);font-size:14px;width:20px;}
.route-item .l{flex:1;font-size:13.5px;}
.route-item .place{font-size:11px;color:var(--ink-dim);display:block;margin-top:2px;}
.qr-item{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px;margin-bottom:12px;}
.qr-item h3{font-size:14px;color:var(--gold-bright);margin-bottom:2px;}
.qr-item .place-tag{font-size:12px;color:var(--ink-dim);margin-bottom:8px;}
.qr-item .lnk{font-family:var(--font-mono);font-size:11px;color:var(--ink-dim);word-break:break-all;}
.qr-canvas-holder{background:#fff;padding:8px;border-radius:10px;display:inline-block;margin-top:8px;}
footer.foot{text-align:center;padding:18px 0 6px;}
.reset-link{color:var(--ink-dim);font-size:12px;text-decoration:underline;cursor:pointer;background:none;border:none;}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:100;}
@media (max-width:380px){ .mission-title{font-size:20px;} .room-item{width:50px;height:50px;font-size:22px;} }
</style>
<title>Mission 1</title>
</head>
<body>
<div id="lantern"></div>
<canvas id="confetti"></canvas>
<div id="app"><div class="wrap" style="--accent:#e0954f">

<script>document.write(topbarHtml())</script>
<script>document.write(trailHtml(1))</script>
<div class="card">
  <div class="mission-badge">
    <div class="mission-icon">&#127862;</div>
    <div>
      <div class="mission-eyebrow">Mission 1 of 5</div>
      <div class="mission-title">Find What&rsquo;s Hidden</div>
    </div>
  </div>
  <p class="mission-flavor">Something in this room holds four pairs of memories. Flip the cards and match them all before time slips away.</p>
  <div id="puzzle-zone"></div>
</div>

</div></div>
<div class="toast" id="toast"></div>
<script>

function loadProgress(){ try{ return JSON.parse(localStorage.getItem('th_progress_v2'))||{}; }catch(e){ return {}; } }
function saveProgress(p){ localStorage.setItem('th_progress_v2', JSON.stringify(p)); }
let progress = loadProgress();
const MISSION_ORDER = ['m1','m2','m3','m4','m5'];
function isDone(k){ return !!progress[k]; }
function markDone(k){ progress[k]=true; saveProgress(progress); }
function completedCount(){ return MISSION_ORDER.filter(isDone).length; }

function trailHtml(activeIdx){
  return '<div class="trail">' + MISSION_ORDER.map((k,i)=>{
    const done = isDone(k);
    const current = (i+1)===activeIdx;
    return '<div class="trail-node '+(done?'done':'')+' '+(current?'current':'')+'">'
      + '<div class="trail-dot">'+(done?'&#10004;':(i+1))+'</div>'
      + '<div class="trail-label">M'+(i+1)+'</div></div>';
  }).join('') + '</div>';
}
function topbarHtml(){
  return '<div class="topbar"><div class="brand">&#9670; Treasure Hunt</div><div class="count-pill">'+completedCount()+'/5</div></div>';
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

window.addEventListener('pointermove', e=>{
  document.documentElement.style.setProperty('--lx', e.clientX+'px');
  document.documentElement.style.setProperty('--ly', e.clientY+'px');
});
window.addEventListener('touchmove', e=>{
  if(e.touches[0]){
    document.documentElement.style.setProperty('--lx', e.touches[0].clientX+'px');
    document.documentElement.style.setProperty('--ly', e.touches[0].clientY+'px');
  }
}, {passive:true});

const confettiCanvas = document.getElementById('confetti');
const cctx = confettiCanvas.getContext('2d');
function resizeCanvas(){ confettiCanvas.width=innerWidth; confettiCanvas.height=innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
let particles = [];
const CONFETTI_COLORS = ['#e8b95c','#f8d999','#9b7fe8','#63c584','#e2705a','#ede6d3'];
function burstConfetti(big){
  const count = big?160:70;
  for(let i=0;i<count;i++){
    particles.push({
      x: innerWidth/2 + (Math.random()-0.5)*(big?innerWidth*0.7:120),
      y: big?innerHeight*0.3:innerHeight*0.35,
      vx:(Math.random()-0.5)*(big?9:6), vy:Math.random()*-6-2,
      size:Math.random()*6+4, color:CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
      rot:Math.random()*360, vr:(Math.random()-0.5)*10, life:0,
    });
  }
}
function tickConfetti(){
  cctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);
  particles.forEach(p=>{
    p.vy+=0.18; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++;
    cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot*Math.PI/180);
    cctx.fillStyle=p.color; cctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    cctx.restore();
  });
  particles = particles.filter(p=> p.y<innerHeight+40 && p.life<260);
  requestAnimationFrame(tickConfetti);
}
tickConfetti();


function revealClue(){
  markDone('m1');
  burstConfetti();
  setTimeout(()=>{
    document.getElementById('puzzle-zone').innerHTML = `
      <div class="clue-box">&#127814; The next destination is where every moment becomes a story and every click captures a memory.</div>
      <div style="height:12px"></div>
      <button class="btn btn-primary" onclick="location.href='mission2.html'">Solved! Continue &rarr;</button>
    `;
    document.querySelector('.mission-eyebrow').textContent = 'Mission 1 of 5 &mdash; Complete';
  }, 500);
}


function mountPuzzle(){
  const zone = document.getElementById('puzzle-zone');
  const icons = ['&#128248;','&#128149;','&#127880;','&#11088;'];
  const deck = shuffle([...icons, ...icons]);
  zone.innerHTML = '<div class="memory-grid" id="memgrid"></div>';
  const grid = document.getElementById('memgrid');
  let firstIdx = null, lock = false, matched = 0;
  deck.forEach((icon)=>{
    const card = document.createElement('div');
    card.className = 'mem-card';
    card.innerHTML = '<div class="mem-inner"><div class="mem-face mem-front">?</div><div class="mem-face mem-back">'+icon+'</div></div>';
    card.onclick = ()=>{
      if(lock || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      card.classList.add('flipped');
      if(firstIdx===null){ firstIdx = {icon, card}; return; }
      lock = true;
      if(firstIdx.icon === icon && firstIdx.card !== card){
        firstIdx.card.classList.add('matched'); card.classList.add('matched');
        matched++; firstIdx=null; lock=false;
        if(matched === icons.length){ showToast('All memories matched!'); setTimeout(revealClue, 500); }
      } else {
        setTimeout(()=>{ firstIdx.card.classList.remove('flipped'); card.classList.remove('flipped'); firstIdx=null; lock=false; }, 650);
      }
    };
    grid.appendChild(card);
  });
}

if(isDone('m1')){ revealClue(); } else { mountPuzzle(); }

</script>
</body>
</html>
